# ==============================================================================
# TrustVault - Test Configuration
# Uses isolated in-memory database to execute tests without external PostgreSQL
# ==============================================================================
spring.datasource.url=jdbc:h2:mem:trustvault_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Test Storage Location
trustvault.storage.upload-dir=./target/test-storage

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
