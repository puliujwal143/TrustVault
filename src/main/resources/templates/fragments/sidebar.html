<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="sidebar(activeTab)" class="app-sidebar" aria-label="Sidebar Navigation">
  <div class="sidebar-nav">
    <!-- Vault Section -->
    <div>
      <div class="nav-section-title">Vault</div>
      <ul class="nav-menu">
        <li>
          <a th:href="@{/documents}" class="nav-item-link" th:classappend="${activeTab == 'all' ? 'active' : ''}">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            <span>All Documents</span>
          </a>
        </li>
        <li>
          <a th:href="@{/documents(filter='owned')}" class="nav-item-link" th:classappend="${activeTab == 'owned' ? 'active' : ''}">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span>My Documents</span>
          </a>
        </li>
        <li>
          <a th:href="@{/documents(filter='shared')}" class="nav-item-link" th:classappend="${activeTab == 'shared' ? 'active' : ''}">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <span>Shared with Me</span>
          </a>
        </li>
      </ul>
    </div>

    <!-- Security Section -->
    <div>
      <div class="nav-section-title">Security</div>
      <ul class="nav-menu">
        <li>
          <a th:href="@{/audit}" class="nav-item-link" th:classappend="${activeTab == 'audit' ? 'active' : ''}">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              <polyline points="9 12 11 14 15 10"></polyline>
            </svg>
            <span>Audit History</span>
          </a>
        </li>
      </ul>
    </div>
  </div>

  <!-- Security Verification Footer Badge -->
  <div class="sidebar-footer">
    <div class="security-badge-box">
      <svg class="security-badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      <div>
        <div class="security-badge-title">Private Storage</div>
        <div class="security-badge-desc">Zero static exposure &bull; AES &amp; SHA-256 verified integrity</div>
      </div>
    </div>
  </div>
</aside>

</body>
</html>
