<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head(title=${pageTitle != null ? pageTitle : (status == 403 ? 'Access Denied — TrustVault' : (status == 404 ? 'Document Not Found — TrustVault' : 'Error — TrustVault'))})}">
</head>
<body class="app-shell">

  <!-- Accessible Skip Link -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Top Navigation Header -->
  <header th:replace="~{fragments/navbar :: navbar}"></header>

  <!-- Main Application Body -->
  <div class="app-container">
    <!-- Collapsible Sidebar -->
    <aside th:replace="~{fragments/sidebar :: sidebar(activeTab=${activeTab != null ? activeTab : 'all'})}"></aside>

    <!-- Main Content Region -->
    <main id="main-content" class="app-main" role="main" style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 180px); padding: var(--space-8) var(--space-4);">

      <div class="error-container" style="max-width: 580px; width: 100%; margin: 0 auto; text-align: center;">
        <div class="card error-card" style="padding: var(--space-8); box-shadow: var(--shadow-lg); border: 1px solid var(--border-subtle); background-color: var(--bg-surface); border-radius: var(--radius-lg);">

          <!-- Semantic Status Icon Box -->
          <div class="error-icon-box"
               style="margin: 0 auto var(--space-5) auto; width: 68px; height: 68px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center;"
               th:styleappend="${status == 403 ? 'background-color: var(--color-danger-subtle); color: var(--color-danger); border: 1px solid var(--color-danger-border);' : (status == 404 ? 'background-color: var(--color-warning-subtle); color: var(--color-warning); border: 1px solid var(--color-warning-border);' : 'background-color: var(--color-danger-subtle); color: var(--color-danger); border: 1px solid var(--color-danger-border);')}">

            <!-- 403 Access Denied Icon (Shield Lock) -->
            <svg th:if="${status == 403}" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              <rect x="9" y="11" width="6" height="5" rx="1"></rect>
              <path d="M10 11V9a2 2 0 1 1 4 0v2"></path>
            </svg>

            <!-- 404 Not Found Icon (Document Question) -->
            <svg th:if="${status == 404}" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <circle cx="12" cy="14" r="3"></circle>
              <line x1="12" y1="11" x2="12" y2="13"></line>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>

            <!-- 500 & Other Server Errors (Alert Octagon) -->
            <svg th:if="${status != 403 and status != 404}" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"></polygon>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
          </div>

          <!-- HTTP Status Code Badge -->
          <div style="margin-bottom: var(--space-3);">
            <span class="badge" id="error-status-badge"
                  th:classappend="${status == 403 ? 'alert-danger' : (status == 404 ? 'alert-warning' : 'alert-danger')}"
                  style="font-family: var(--font-mono); font-size: var(--text-xs); padding: 4px 12px; letter-spacing: 0.05em; font-weight: 600;"
                  th:text="${status != null ? (status + ' ' + (status == 403 ? 'FORBIDDEN' : (status == 404 ? 'NOT FOUND' : (status == 500 ? 'INTERNAL ERROR' : (error != null ? error : 'ERROR'))))) : 'ERROR'}">
              404 NOT FOUND
            </span>
          </div>

          <!-- Primary Heading -->
          <h1 class="error-title" id="error-heading"
              style="font-size: var(--text-2xl); font-weight: 700; letter-spacing: -0.025em; margin: 0 0 var(--space-3) 0; color: var(--text-primary);"
              th:text="${heading != null ? heading : (status == 403 ? 'Access Denied' : (status == 404 ? 'Document Not Found' : 'Unexpected Server Error'))}">
            Document Not Found
          </h1>

          <!-- User-Friendly Short Explanation -->
          <p class="error-description" id="error-explanation"
             style="font-size: var(--text-sm); line-height: var(--leading-base); color: var(--text-secondary); margin: 0 0 var(--space-6) 0; max-width: 480px; margin-left: auto; margin-right: auto;"
             th:text="${message != null && !message.isEmpty() ? message : (status == 403 ? 'You do not have permission to access this document or resource. If you believe this is an error, please contact the document owner to request access.' : (status == 404 ? 'The requested document does not exist, has been removed, or you do not have permission to view it.' : 'An unexpected error occurred while processing your request. Please try again later or contact your system administrator.'))}">
            The requested document does not exist, has been removed, or you do not have permission to view it.
          </p>

          <!-- Safe Path Context Box -->
          <div th:if="${path != null and !path.isEmpty()}" style="margin-bottom: var(--space-6); background-color: var(--bg-surface-subtle); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: var(--space-2) var(--space-4); display: inline-flex; align-items: center; gap: var(--space-2); max-width: 100%; overflow: hidden;">
            <span style="font-size: var(--text-xs); color: var(--text-muted); font-weight: 500;">Path:</span>
            <code style="font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-secondary); word-break: break-all;" th:text="${path}">/documents/999</code>
          </div>

          <!-- Navigation Action Buttons -->
          <div class="error-actions" style="display: flex; align-items: center; justify-content: center; gap: var(--space-3); flex-wrap: wrap;">
            <a th:href="@{/documents}" class="btn btn-primary" id="return-dashboard-btn" style="min-width: 190px;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
              </svg>
              <span>Return to Dashboard</span>
            </a>

            <a th:href="@{/documents(filter='shared')}" class="btn btn-secondary" id="shared-docs-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
              </svg>
              <span>Shared Documents</span>
            </a>
          </div>

        </div>
      </div>

    </main>
  </div>

</body>
</html>
