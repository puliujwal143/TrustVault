# ==============================================================================
# TrustVault - Application Configuration
# ==============================================================================
# All sensitive parameters (database credentials, secrets, storage paths)
# MUST be injected via environment variables. Do NOT hardcode credentials.
# ==============================================================================

spring:
  application:
    name: trustvault

  # ----------------------------------------------------------------------------
  # Servlet / Multipart Upload Configuration
  # ----------------------------------------------------------------------------
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:11MB}

  # ----------------------------------------------------------------------------
  # PostgreSQL Datasource Configuration
  # ----------------------------------------------------------------------------
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trustvault}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ----------------------------------------------------------------------------
  # Spring Data JPA / Hibernate Configuration
  # ----------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}
    show-sql: ${SHOW_SQL:false}
    open-in-view: false

  # ----------------------------------------------------------------------------
  # Thymeleaf Template Engine Configuration
  # ----------------------------------------------------------------------------
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}
    mode: HTML
    encoding: UTF-8
    check-template-location: true

# ------------------------------------------------------------------------------
# Logging Configuration
# ------------------------------------------------------------------------------
logging:
  file:
    name: logs/trustvault.log
  level:
    root: INFO
    com.trustvault: DEBUG

# ------------------------------------------------------------------------------
# Server Configuration
# ------------------------------------------------------------------------------
server:
  port: ${PORT:8080}
  # Forwarded headers strategy for reverse proxies (Render, AWS ALB, Cloudflare).
  # Uses Tomcat's native RemoteIpValve to safely resolve client IP and scheme
  # strictly from trusted internal proxy ranges, preventing client IP spoofing.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
      internal-proxies: '10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[0-1])\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1'
      trusted-proxies: '104\.(1[6-9]|2[0-7])\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)|162\.(15[89])\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)|172\.(6[4-9]|7[01])\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)|131\.0\.(7[2-5])\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)|141\.101\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)|108\.162\.(19[2-9]|2[0-4]\d|25[0-5])\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)|190\.93\.(24\d|25[0-5])\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)|188\.114\.(9[6-9]|10\d|11[01])\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)|197\.234\.(24[0-3])\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)|198\.41\.(12[89]|1[3-9]\d|2[0-4]\d|25[0-5])\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)|173\.245\.(4[89]|5\d|6[0-3])\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)|103\.21\.(24[4-7])\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)|103\.22\.(20[0-3])\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)|103\.31\.[4-7]\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)|(?i:2400:cb00:[0-9a-f:]+|2606:4700:[0-9a-f:]+|2803:f800:[0-9a-f:]+|2405:b500:[0-9a-f:]+|2405:8100:[0-9a-f:]+|2a06:98c[0-7]:[0-9a-f:]+|2c0f:f248:[0-9a-f:]+)'
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

# ------------------------------------------------------------------------------
# TrustVault Storage Configuration (Private & Non-Static)
# ------------------------------------------------------------------------------
trustvault:
  storage:
    # Uploaded documents must NEVER be located in public static asset directories
    upload-dir: ${STORAGE_UPLOAD_DIR:./private-storage/uploads}
    provider: ${TRUSTVAULT_STORAGE_PROVIDER:local}
    convex:
      base-url: ${TRUSTVAULT_CONVEX_BASE_URL:}
      shared-secret: ${TRUSTVAULT_CONVEX_SHARED_SECRET:}

  dev:
    seed-user:
      # Disabled by default; only active when 'dev' profile is enabled AND this is set to true
      enabled: ${TV_DEV_SEED_ENABLED:false}
      username: ${TV_DEV_USERNAME:}
      password: ${TV_DEV_PASSWORD:}
      email: ${TV_DEV_EMAIL:}

    reset-password:
      # Explicit one-time opt-in; only active when 'dev' profile is enabled AND this is set to true
      enabled: ${TV_DEV_RESET_PASSWORD:false}
      exit-after-reset: ${TV_DEV_RESET_EXIT_AFTER:true}
